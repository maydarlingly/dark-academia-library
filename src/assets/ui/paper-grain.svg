<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400">
  <!-- Мелкое волокно бумаги -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="3" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.36  0 0 0 0 0.22  0 0 0 0 0.10  0 0 0 0.38 0"/>
  </filter>
  <!-- Крупные пятна и потёртости -->
  <filter id="stains" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="4" seed="9" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.27  0 0 0 0 0.10  0 0 0 0.55 -0.16"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#stains)"/>
  <rect width="100%" height="100%" filter="url(#grain)"/>
</svg>

<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Invisible Library — Полуночная библиотека</title>
    <meta name="description" content="The Invisible Library — полуночная 3D-библиотека в стиле Dark Academia: старинные шкафы, свечи и книги, которые можно читать прямо в браузере." />
    <meta name="theme-color" content="#0b0806" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cormorant+SC:wght@500;600&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=swap"
    />
  </head>

  <body class="bg-night font-serif text-parchment-100 antialiased">
    <!-- ═══════════════ 3D-сцена ═══════════════ -->
    <canvas id="scene" class="scene-canvas fixed inset-0 h-full w-full" aria-label="Зал библиотеки"></canvas>
    <div class="vignette pointer-events-none fixed inset-0" aria-hidden="true"></div>

    <!-- ═══════════════ 2D-интерфейс поверх сцены ═══════════════ -->
    <div id="ui" class="pointer-events-none fixed inset-0 z-10 flex flex-col">
      <header class="flex items-start justify-between gap-4 p-4 sm:p-7">
        <div class="pointer-events-auto select-none" data-reveal>
          <p class="font-display text-[0.65rem] tracking-[0.45em] text-gold/80 sm:text-xs">Anno Domini MDCCCXII</p>
          <h1 class="text-glow font-display text-2xl tracking-[0.1em] text-gold-light sm:text-4xl">The Invisible Library</h1>
          <p class="mt-0.5 text-sm italic text-parchment-200/70 sm:text-lg">Полуночная библиотека</p>
        </div>

        <nav class="pointer-events-auto flex gap-2" data-reveal>
          <button class="btn-gilded sound-toggle px-3" type="button" data-sound-toggle aria-pressed="true" aria-label="Выключить звук">
            <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
              <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" />
              <path class="sound-on" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" />
              <path class="sound-off" d="M16 9.5l5 5M21 9.5l-5 5" />
            </svg>
          </button>
          <button id="open-shelves" class="btn-gilded relative" type="button" aria-controls="shelves-panel" aria-expanded="false">
            <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
              <path d="M4 4h3v16H4zM9 6h3v14H9zM14.5 5.2l2.8-.7 3.4 14.6-2.8.7z" />
              <path d="M3 20.5h18" />
            </svg>
            <span>Мои полки</span>
            <span class="shelf-badge" data-shelf-badge hidden>0</span>
          </button>
        </nav>
      </header>

      <div class="flex-1"></div>

      <footer class="grid justify-items-center p-4 sm:p-7" data-reveal>
        <p id="hint" class="parchment parchment--slip pointer-events-auto col-start-1 row-start-1 self-end px-6 py-2.5 text-center text-sm italic sm:text-base">
          <span data-hint-default>
            <span class="pointer-coarse:hidden">Нажмите на шкаф, чтобы подойти ближе</span>
            <span class="hidden pointer-coarse:inline">Коснитесь шкафа, чтобы подойти ближе</span>
          </span>
          <span class="not-italic font-display tracking-[0.08em] text-ink" data-hint-book hidden></span>
        </p>

        <!-- Панель «у полки»: другие полки, прокрутка, книги этой полки, возврат в зал -->
        <div id="shelf-hud" class="shelf-hud parchment parchment--slip pointer-events-auto col-start-1 row-start-1 self-end" role="toolbar" aria-label="Навигация по шкафу" hidden>
          <div class="flex items-center gap-2 sm:gap-3">
            <button class="hud-btn" type="button" data-hud="back" aria-label="Вернуться в зал"><svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg><span class="hidden sm:inline">В зал</span></button>
            <span class="hud-sep max-sm:hidden" aria-hidden="true"></span>
            <button class="hud-btn hud-pan" type="button" data-hud="left" aria-label="Сдвинуться левее"><svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg></button>
            <div class="min-w-0 flex-1 text-center">
              <p class="truncate font-display text-sm leading-tight tracking-[0.1em] text-ink sm:text-base" data-hud-label></p>
              <p class="truncate text-xs italic text-ink-soft sm:text-sm" data-hud-sub></p>
            </div>
            <button class="hud-btn hud-pan" type="button" data-hud="right" aria-label="Сдвинуться правее"><svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg></button>
            <span class="hud-sep max-sm:hidden" aria-hidden="true"></span>
            <div class="flex flex-col gap-1">
              <button class="hud-btn hud-btn--small" type="button" data-hud="up" aria-label="Полка выше"><svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 15l7-7 7 7" /></svg></button>
              <button class="hud-btn hud-btn--small" type="button" data-hud="down" aria-label="Полка ниже"><svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 9l7 7 7-7" /></svg></button>
            </div>
          </div>
          <div class="hud-books" data-hud-books></div>
        </div>
      </footer>
    </div>

    <!-- ═══════════════ Карточка книги (после подлёта камеры) ═══════════════ -->
    <aside
      id="book-card"
      class="parchment parchment--torn fixed bottom-6 right-4 z-20 w-[min(26rem,calc(100vw-2rem))] px-8 py-7 sm:right-8 sm:top-1/2 sm:bottom-auto sm:-translate-y-1/2"
      aria-live="polite"
      hidden
    >
      <p class="font-display text-xs tracking-[0.35em] text-oxblood" data-field="genre">Жанр</p>
      <h2 class="mt-1 font-display text-3xl leading-tight text-ink" data-field="title">Название</h2>
      <p class="mt-1 text-lg italic text-ink-soft" data-field="author">Автор</p>
      <div class="flourish my-4" aria-hidden="true"></div>
      <p class="text-base leading-relaxed text-ink" data-field="description">Описание книги.</p>
      <div class="mt-6 flex flex-wrap gap-3">
        <button class="btn-wax" type="button" data-action="read">Читать</button>
        <button class="btn-ink" type="button" data-action="shelve">На полку</button>
        <button class="btn-quiet ml-auto" type="button" data-action="close">Вернуть</button>
      </div>
      <label class="mt-5 flex items-center gap-3">
        <span class="font-display text-xs tracking-[0.25em] text-ink-soft">Список</span>
        <span class="select-ink flex-1">
          <select data-field="status" aria-label="Список чтения"></select>
        </span>
      </label>
    </aside>

    <!-- ═══════════════ Читалка: разворот старинной книги ═══════════════ -->
    <section id="reader" class="reader fixed inset-0 z-30 flex flex-col items-center justify-center gap-4 p-3 sm:gap-5 sm:p-6" role="dialog" aria-modal="true" aria-labelledby="reader-title" hidden>
      <h2 id="reader-title" class="sr-only" data-field="title">Чтение книги</h2>
      <div class="book-spread" data-spread>
        <!-- Обложка: распахивается при открытии и закрывается при выходе -->
        <div class="book-cover" data-cover aria-hidden="true">
          <div class="book-cover__face book-cover__front">
            <p class="book-cover__author" data-cover-author></p>
            <p class="book-cover__title" data-cover-title></p>
            <span class="book-cover__ornament">❦</span>
          </div>
          <div class="book-cover__face book-cover__back"></div>
        </div>
        <article class="book-page book-page--left" data-side="left">
          <header class="running-head" data-head></header>
          <div class="page-body" data-body></div>
          <footer class="folio" data-folio></footer>
        </article>
        <article class="book-page book-page--right" data-side="right">
          <header class="running-head" data-head></header>
          <div class="page-body" data-body></div>
          <footer class="folio" data-folio></footer>
        </article>
      </div>

      <nav class="flex w-full max-w-xl items-center justify-center gap-3 sm:gap-4" aria-label="Листание">
        <button class="btn-gilded px-4 text-lg" type="button" data-action="prev" aria-label="Предыдущая страница">‹</button>
        <div class="flex min-w-0 flex-1 flex-col items-center gap-2">
          <span class="font-display text-xs tracking-[0.16em] text-parchment-200/90 sm:text-sm" data-field="counter" aria-live="polite"></span>
          <span class="reader-progress" aria-hidden="true"><span data-progress></span></span>
        </div>
        <button class="btn-gilded px-4 text-lg" type="button" data-action="next" aria-label="Следующая страница">›</button>
        <button class="btn-gilded sound-toggle px-3" type="button" data-sound-toggle aria-pressed="true" aria-label="Выключить звук">
            <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
              <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" />
              <path class="sound-on" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" />
              <path class="sound-off" d="M16 9.5l5 5M21 9.5l-5 5" />
            </svg>
        </button>
        <button class="btn-gilded" type="button" data-action="close">Закрыть</button>
      </nav>

      <button id="save-quote" class="btn-wax fixed z-40 text-sm" type="button" hidden>❝ Сохранить цитату</button>
      <p class="reader-toast parchment parchment--slip px-6 py-2.5 text-center text-sm italic" data-toast role="status" hidden></p>
    </section>

    <!-- ═══════════════ Личный кабинет «Мои полки» ═══════════════ -->
    <aside id="shelves-panel" class="drawer fixed top-0 right-0 z-40 h-full w-full max-w-md p-3 sm:p-5" aria-labelledby="shelves-title" aria-hidden="true" inert>
      <div class="parchment parchment--torn flex h-full flex-col px-7 py-8 sm:px-9">
        <div class="flex items-start justify-between gap-4">
          <div>
            <p class="font-display text-xs tracking-[0.4em] text-ink-soft">Ex libris</p>
            <h2 id="shelves-title" class="font-display text-3xl text-ink sm:text-4xl">Мои полки</h2>
          </div>
          <button class="btn-quiet text-2xl leading-none" type="button" data-close aria-label="Закрыть">×</button>
        </div>

        <div class="flourish my-5" aria-hidden="true"></div>

        <div class="flex gap-6 font-display text-sm tracking-[0.14em]" role="tablist">
          <button class="tab" type="button" role="tab" data-tab="books" aria-selected="true">Полка <span data-count="books">0</span></button>
          <button class="tab" type="button" role="tab" data-tab="lists" aria-selected="false">Списки <span data-count="lists">0</span></button>
          <button class="tab" type="button" role="tab" data-tab="quotes" aria-selected="false">Цитаты <span data-count="quotes">0</span></button>
        </div>

        <div class="scroll-ink mt-5 -mr-3 flex-1 overflow-y-auto pr-3">
          <section data-panel="books" role="tabpanel" aria-label="Книги на полке">
            <!-- Живая полка: книги встают на неё, когда вы нажимаете «На полку» -->
            <div class="home-shelf">
              <div class="home-shelf__dust" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>
              <div class="home-shelf__row" data-shelf-row>
                <div class="home-shelf__candle candle" aria-hidden="true"><span class="candle-flame"></span></div>
                <span class="bookend" data-bookend aria-hidden="true"></span>
              </div>
              <div class="home-shelf__board" aria-hidden="true"></div>
              <p class="home-shelf__empty" data-shelf-empty>Полка ждёт первую книгу</p>
            </div>
            <ul class="mt-6 space-y-3" data-list="books"></ul>
          </section>
          <section data-panel="lists" role="tabpanel" aria-label="Списки чтения" hidden>
            <div class="flex flex-wrap gap-2" data-status-filters role="group" aria-label="Какой список показать"></div>
            <ul class="mt-5 space-y-3" data-list="statuses"></ul>
          </section>
          <section data-panel="quotes" role="tabpanel" aria-label="Цитаты" hidden>
            <ul class="space-y-4" data-list="quotes"></ul>
          </section>
        </div>

        <!-- «Удалено · Вернуть» -->
        <div class="panel-undo" data-undo role="status" hidden>
          <span class="min-w-0 flex-1 truncate" data-undo-text></span>
          <button class="btn-ink px-3 py-1.5 text-sm" type="button" data-undo-action>Вернуть</button>
        </div>
      </div>
    </aside>

    <!-- ═══════════════ Экран загрузки ═══════════════ -->
    <div id="loader" class="fixed inset-0 z-50 grid place-items-center bg-night">
      <div class="parchment parchment--torn px-12 py-9 text-center">
        <div class="candle mx-auto mb-5" aria-hidden="true"><span class="candle-flame"></span></div>
        <p class="font-display text-lg tracking-[0.25em] text-ink" data-status>Зажигаем свечи…</p>
      </div>
    </div>

    <!-- SVG-фильтры для неровных, «подранных» краёв бумаги -->
    <svg class="absolute size-0" aria-hidden="true" focusable="false">
      <filter id="paper-edge" x="-3%" y="-3%" width="106%" height="106%">
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" seed="4" />
        <feDisplacementMap in="SourceGraphic" scale="7" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <filter id="paper-torn" x="-4%" y="-4%" width="108%" height="108%">
        <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="5" seed="11" />
        <feDisplacementMap in="SourceGraphic" scale="14" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
